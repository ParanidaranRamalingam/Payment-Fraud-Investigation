<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Shared document head. Usage: <head th:replace="~{fragments/layout :: head('Page title')}"></head> -->
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title th:text="${pageTitle} + ' — Fraud Operations Workspace'">Fraud Operations Workspace</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/app.js}" defer></script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e6f8f'/%3E%3Cpath d='M16 6l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V9z' fill='white' opacity='.92'/%3E%3C/svg%3E">
</head>

<!-- Top application header: product name, processor mode, health and actor identity. -->
<body>
<header class="app-header" th:fragment="header">
    <a class="app-header__brand" th:href="@{/ui}">
        <span class="app-header__logo" aria-hidden="true">&#128737;</span>
        <span>Fraud Operations</span>
    </a>
    <div class="app-header__meta">
        <span class="mode-chip" th:text="${appMode}" title="Active processor mode">RULES</span>
        <span class="health-dot" title="Application health">
            <span class="visually-hidden">Service status:</span><a th:href="@{/actuator/health}" style="color:inherit;text-decoration:none">Healthy</a>
        </span>
        <span class="user-chip" th:if="${actor != null}">
            <span aria-hidden="true">&#128100;</span>
            <span th:text="${actor}">analyst</span>
        </span>
    </div>
</header>
</body>

<!-- Left navigation; collapses to a horizontal strip at tablet width. -->
<nav class="app-nav" th:fragment="nav(active)" aria-label="Primary">
    <ul>
        <li><a th:href="@{/ui}" th:attr="aria-current=${active == 'cases' ? 'page' : null}">
            <span class="nav-icon" aria-hidden="true">&#128203;</span>Cases</a></li>
        <li><a th:href="@{/ui/cases/new}" th:attr="aria-current=${active == 'new' ? 'page' : null}">
            <span class="nav-icon" aria-hidden="true">&#10133;</span>New Case</a></li>
    </ul>
    <th:block th:if="${c != null}">
        <div class="app-nav__section">Current case</div>
        <ul>
            <li><a th:href="@{/ui/cases/{id}(id=${c.caseId})}"
                   th:attr="aria-current=${active == 'investigation' ? 'page' : null}">
                <span class="nav-icon" aria-hidden="true">&#128269;</span>Investigation</a></li>
            <li><a th:href="@{/ui/cases/{id}/recommendation(id=${c.caseId})}"
                   th:attr="aria-current=${active == 'recommendation' ? 'page' : null}">
                <span class="nav-icon" aria-hidden="true">&#128161;</span>Recommendation</a></li>
            <li><a th:href="@{/ui/cases/{id}/evidence(id=${c.caseId})}"
                   th:attr="aria-current=${active == 'evidence' ? 'page' : null}">
                <span class="nav-icon" aria-hidden="true">&#128462;</span>Evidence</a></li>
            <li><a th:href="@{/ui/cases/{id}/citations(id=${c.caseId})}"
                   th:attr="aria-current=${active == 'citations' ? 'page' : null}">
                <span class="nav-icon" aria-hidden="true">&#128214;</span>Policy</a></li>
            <li><a th:href="@{/ui/cases/{id}/review(id=${c.caseId})}"
                   th:attr="aria-current=${active == 'review' ? 'page' : null}">
                <span class="nav-icon" aria-hidden="true">&#128221;</span>Review &amp; Audit</a></li>
        </ul>
    </th:block>
</nav>

</body>
</html>
