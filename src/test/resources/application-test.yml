        password: "{bcrypt}$2b$10$Td3EKktJ8NAXMiDcNNg3DevWjnw53T8S0FmdTWJ.XdfQOn640A1WW"
        roles: [ ANALYST ]
      - username: it-reviewer
        password: "{bcrypt}$2b$10$8poTtXkRF1Lx6hf3SRjJUeWLhgXxritGKdEIuQpJdPEY2K7foLm8a"
        roles: [ REVIEWER ]
      - username: it-lead
